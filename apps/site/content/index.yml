          style: flag
    - segments:
        - text: "→ Paper → Purpur → "
          style: dim
        - text: "SpoutCraft Redux"
          style: cmd
    - segments:
        - text: "→ Listening on "
          style: dim
        - text: "*:25565 "
          style: cmd
        - text: "✓"
          style: success
    - segments:
        - text: " "
          style: dim
    - segments:
        - text: "> "
          style: prompt
        - text: "spoutcraftredux list"
          style: cmd
    - segments:
        - text: "→ Steve  "
          style: dim
