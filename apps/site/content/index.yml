seo:
  title: SpoutCraft Redux
  description: SpoutCraft Redux brings Spoutcraft back for Minecraft 26.3. A Purpur-based server and a Fabric client mod for custom GUIs, HUDs, notifications, sounds and key bindings.
title: "Spoutcraft, remade\nfor modern Minecraft."
description: A Purpur-based server and a Fabric client mod that let servers push custom GUIs, HUDs, notifications, sounds and key bindings to players.
hero:
  headline: "For Minecraft 26.3"
  links:
    - label: Downloads
      color: primary
      size: xl
      to: /downloads
      trailingIcon: i-lucide-download
    - label: Read the docs
      size: xl
      color: neutral
      variant: soft
      to: https://docs.spoutcraftredux.org
      target: _blank
terminal:
  lines:
    - segments:
        - text: "$ "
          style: prompt
        - text: "java -jar spoutcraftredux-paperclip-26.3.jar"
          style: cmd
        - text: " --nogui"
          style: flag
    - segments:
        - text: "→ Paper → Purpur → "
          style: dim
        - text: "SpoutCraft Redux"
          style: cmd
    - segments:
        - text: "→ Listening on "
          style: dim
        - text: "*:25565 "
          style: cmd
        - text: "✓"
          style: success
    - segments:
        - text: " "
          style: dim
    - segments:
        - text: "> "
          style: prompt
        - text: "spoutcraftredux list"
          style: cmd
    - segments:
        - text: "→ Steve  "
          style: dim
        - text: "SpoutCraft Redux client"
          style: metric-good
    - segments:
        - text: "→ Alex   "
          style: dim
        - text: "vanilla client"
          style: url
features:
  headline: Features
  title: "What the client mod unlocks."
  description: The classic Spoutcraft feature set, rebuilt on modern Minecraft. Players without the client can still join, and the server points them to the download.
  items:
    - icon: i-lucide-layout-dashboard
      title: Custom GUIs and HUD
      description: Server-driven screens with buttons, text fields, sliders, lists and images, plus HUD widgets drawn over the game.
      badge: Client mod
    - icon: i-lucide-cloud-sun
      title: Sky and environment
      description: Sky, fog and cloud colours, cloud height, stars, and the size and texture of the sun and moon, set per player and reset on disconnect.
      badge: Client mod
    - icon: i-lucide-audio-lines
      title: Custom sounds and resource packs
      description: Plugins ship sounds, models and textures in a resource pack that the server merges and sends to every player on join.
      badge: Works on vanilla
    - icon: i-lucide-keyboard
      title: Server key bindings
      description: Plugins register key bindings that players see and rebind under Custom Bindings in the Controls screen. Presses arrive as events, only for keys the server declared.
      badge: Client mod
    - icon: i-lucide-map-pin
      title: Waypoints
      description: In-world waypoints for players with the client, with Xaero's and JourneyMap integration.
      badge: Later
    - icon: i-lucide-shirt
      title: Capes and nameplates
      description: Server-provided cape textures and multi-line coloured name titles.
      badge: Later
    - icon: i-lucide-move
      title: Movement
      description: Gravity, walking and jumping multipliers built on vanilla attributes, so they apply to every player on the server.
      badge: Works on vanilla
    - icon: i-lucide-bell
      title: Notifications
      description: A popup that slides in at the top right with a title, a message and an item icon.
      badge: Client mod
    - icon: i-lucide-box
      title: Custom blocks
      description: Server-defined blocks are the hardest part and come last, starting with a mapping onto spare vanilla block states.
      badge: Later
platform:
  headline: Platform
  title: "A server, a mod, and room for everyone."
  description: SpoutCraft Redux is two pieces that talk over a versioned handshake.
  items:
    - icon: i-lucide-server
      title: Purpur-based server
      description: A fork in the Paper → Purpur → SpoutCraft Redux chain, shipped as a single paperclip jar. Paper and Purpur plugins keep working.
    - icon: i-lucide-puzzle
      title: Fabric client mod
      description: A Fabric mod for Minecraft 26.3 that announces its capabilities when joining. NeoForge support is planned.
    - icon: i-lucide-users
      title: Players without the client
      description: They can still join. Client features do nothing for them, and the server sends a chat message with a link to download the client.
    - icon: i-lucide-code-xml
      title: Plugin API
      description: Plugins compile against spoutcraftredux-api, check whether a player has the client, and use the features it supports.
    - icon: i-lucide-shield-check
      title: Data, not code
      description: The client never runs code sent by a server. Screens, widgets, skies and assets all arrive as data.
    - icon: i-lucide-scale
      title: Open source
      description: Licensed under LGPL-3.0. The server includes Paper and Purpur code, so it is distributed under GPL-3.0 like its upstreams.
developers:
  headline: For plugin developers
  title: "Write plugins against the API."
  description: The API is published to the SpoutCraft Redux Maven repository. Add it as a compileOnly dependency, since the server provides it at runtime. Only snapshots exist for now, and the API will change before the first stable release.
  filename: build.gradle.kts
  snippet: |
    repositories {
        maven("https://repo.spoutcraftredux.org/snapshots")
        maven("https://repo.papermc.io/repository/maven-public/")
    }

    dependencies {
        compileOnly("org.spoutcraftredux:spoutcraftredux-api:26.3.build.+")
    }
  links:
    - label: Developer docs
      to: https://docs.spoutcraftredux.org
      target: _blank
      icon: i-lucide-book-open
      color: neutral
      variant: subtle
    - label: Server source
      to: https://github.com/SpoutCraftRedux/SpoutCraftRedux-Server
      target: _blank
      icon: i-simple-icons-github
      color: neutral
      variant: ghost
cta:
  title: "Follow along\nfrom the first build."
  description: Server and client builds appear on the downloads page as soon as they are published.
  links:
    - label: Go to downloads
      color: primary
      to: /downloads
      trailingIcon: i-lucide-arrow-right
    - label: Read the docs
      color: neutral
      variant: subtle
      to: https://docs.spoutcraftredux.org
      target: _blank
