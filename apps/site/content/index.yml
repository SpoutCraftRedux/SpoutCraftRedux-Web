          style: url
features:
  headline: Features
  title: "What the client mod unlocks."
  description: The classic Spoutcraft feature set, rebuilt on modern Minecraft. Each feature has a vanilla fallback, so a server never has to choose between the two.
  items:
    - icon: i-lucide-layout-dashboard
      title: Custom GUIs and HUD
      description: Server-driven screens with buttons, text fields and sliders, plus HUD widgets that can hide or move the vanilla bars. Popups fall back to vanilla dialogs.
      badge: Client mod
    - icon: i-lucide-cloud-sun
      title: Sky and environment
      description: Sky, fog and cloud colours, cloud height, stars, and the size and texture of the sun and moon, set per player and reset on disconnect.
      badge: Client mod
    - icon: i-lucide-audio-lines
      title: Custom sounds
      description: Sound events delivered through a generated server resource pack, with optional HTTPS streaming that each server has to opt into.
      badge: Works on vanilla
    - icon: i-lucide-keyboard
      title: Server keybinds
      description: Plugins register key bindings that appear under a Server category in the controls menu. Presses arrive as events, only for keys the server declared.
      badge: Client mod
    - icon: i-lucide-map-pin
      title: Waypoints
      description: Locator bar waypoints for every player, with in-world beacons and Xaero's and JourneyMap integration for modded clients.
      badge: Works on vanilla
    - icon: i-lucide-shirt
      title: Capes and nameplates
      description: Server-provided cape textures and multi-line coloured name titles, with text displays as the fallback for vanilla clients.
      badge: Client mod
    - icon: i-lucide-move
      title: Movement
      description: Gravity, walk, swim and jump multipliers built on vanilla attributes, so they apply to every player on the server.
      badge: Works on vanilla
    - icon: i-lucide-bell
      title: Notifications
      description: Native toasts for modded clients, falling back to an advancement toast or an action bar message for everyone else.
      badge: Works on vanilla
    - icon: i-lucide-box
      title: Custom blocks
      description: Server-defined blocks are the hardest part and come last, starting with a mapping onto spare vanilla block states.
      badge: Later
platform:
  headline: Platform
  title: "A server, a mod, and room for everyone."
  description: SpoutCraft Redux is two pieces that talk over a versioned handshake. Neither piece locks out players who skip the other.
  items:
    - icon: i-lucide-server
      title: Purpur-based server
      description: A fork in the Paper → Purpur → SpoutCraft Redux chain, shipped as a single paperclip jar. Paper and Purpur plugins keep working.
    - icon: i-lucide-puzzle
      title: Fabric client mod
      description: A Fabric mod for Minecraft 26.3 that announces its capabilities when joining. NeoForge support is planned.
    - icon: i-lucide-users
      title: Vanilla clients welcome
      description: Players without the mod join as normal. Every feature declares what they see instead, such as a dialog, a resource pack, or nothing.
    - icon: i-lucide-code-xml
      title: Plugin API
      description: Plugins compile against spoutcraftredux-api, check whether a player has the client, and use the features it supports.
    - icon: i-lucide-shield-check
      title: Data, not code
      description: The client never runs code sent by a server. Screens, widgets, skies and assets all arrive as data.
    - icon: i-lucide-scale
      title: Open source
      description: Licensed under LGPL-3.0. The server includes Paper and Purpur code, so it is distributed under GPL-3.0 like its upstreams.
developers:
  headline: For plugin developers
  title: "Write plugins against the API."
  description: The API is published to the SpoutCraft Redux Maven repository. Add it as a compileOnly dependency, since the server provides it at runtime. Only snapshots exist for now, and the API will change before the first stable release.
  filename: build.gradle.kts
  snippet: |
    repositories {
        maven("https://repo.spoutcraftredux.org/snapshots")
        maven("https://repo.papermc.io/repository/maven-public/")
    }

    dependencies {
        compileOnly("org.spoutcraftredux:spoutcraftredux-api:26.3.build.+")
    }
  links:
    - label: Developer docs
      to: https://docs.spoutcraftredux.org
      target: _blank
      icon: i-lucide-book-open
      color: neutral
      variant: subtle
    - label: Server source
      to: https://github.com/SpoutCraftRedux/SpoutCraftRedux-Server
      target: _blank
      icon: i-simple-icons-github
      color: neutral
      variant: ghost
roadmap:
  headline: Roadmap
  title: "Where the project stands."
  description: SpoutCraft Redux is in early development. Each phase ends in a working demo and automated tests.
  items:
    - phase: Phase 0
      title: Skeleton
      description: Server fork, Fabric client, shared protocol and the join handshake.
      current: true
    - phase: Phase 1
      title: Vanilla parity
      description: Movement, text displays, particles, sounds, toasts and server keybinds.
    - phase: Phase 2
      title: Widgets and HUD
      description: The widget toolkit, popup screens, HUD overlays and dialog fallbacks.
    - phase: Phase 3
      title: Environment and appearance
      description: Sky and fog, generated resource packs, custom sounds, capes and nameplates.
    - phase: Phase 4
      title: Items and API polish
      description: Custom items over data components, recipes, Javadoc and a first API freeze.
    - phase: Phase 5
      title: Custom blocks
      description: Block mapping onto vanilla states first, then a decision on deeper client support.
    - phase: Phase 6
      title: Breadth
      description: NeoForge, Minecraft 26.4, minimap integrations and wider release channels.
cta:
  title: "Follow along\nfrom the first build."
  description: Server and client builds appear on the downloads page as soon as they are published. Expect rough edges while the project is in early development.
  links:
    - label: Go to downloads
      color: primary
      to: /downloads
      trailingIcon: i-lucide-arrow-right
    - label: Read the docs
      color: neutral
      variant: subtle
      to: https://docs.spoutcraftredux.org
      target: _blank
