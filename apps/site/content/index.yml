seo:
  title: SpoutCraft Redux
  description: SpoutCraft Redux brings Spoutcraft back for Minecraft 26.3. A Purpur-based server and a Fabric client mod for custom GUIs, HUDs, skies, sounds and keybinds, with full support for players on vanilla clients.
title: "Spoutcraft, remade\nfor modern Minecraft."
description: A Purpur-based server and a Fabric client mod that let servers push custom GUIs, HUDs, skies, sounds and keybinds to players. Players without the mod can still join.
hero:
  headline: "Early development · Minecraft 26.3"
  links:
    - label: Downloads
      color: primary
      size: xl
      to: /downloads
      trailingIcon: i-lucide-download
    - label: Read the docs
      size: xl
      color: neutral
      variant: soft
      to: https://docs.spoutcraftredux.org
      target: _blank
